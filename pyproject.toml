[project]
name = "bges"
version = "0.1.0"
description = "Bilan Gaz à Effet de Serre – NF26"
requires-python = ">=3.13"

dependencies = [
    "pyspark>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nbstripout>=0.7",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# pyspark n'a pas de stubs et tourne dans Docker, pas localement
ignore_missing_imports = true

[tool.nbstripout]
# Supprime les sorties de cellules avant le commit pour des diffs propres
extra_keys = "metadata.kernelspec metadata.language_info"
