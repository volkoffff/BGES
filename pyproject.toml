[project]
name = "bges"
version = "0.1.0"
description = "Bilan Gaz à Effet de Serre – NF26"
requires-python = ">=3.13"

dependencies = [
    "pyspark==3.5.5",
    "pandas==2.2.3",
    "matplotlib==3.10.1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab==4.4.2",
    "ipykernel==6.29.5",
    "nbstripout==0.8.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.nbstripout]
# Supprime les sorties de cellules avant le commit pour des diffs propres
extra_keys = "metadata.kernelspec metadata.language_info"
